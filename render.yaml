services:
  - type: web
    name: hac-gradebook-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_TTL_HOURS
        value: "8"
      - key: CLIENT_ORIGIN
        sync: false
